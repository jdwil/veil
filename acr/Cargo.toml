[workspace]
members = [
    "acr-core",
    "acr-library",
    "acr-eval",
    "acr-mcp",
    "acr-runtime",
]
resolver = "2"

[package]
name = "acr"
version.workspace = true
edition.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
acr-core = { path = "acr-core" }
acr-library = { path = "acr-library" }
acr-eval = { path = "acr-eval" }
acr-runtime = { path = "acr-runtime" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
