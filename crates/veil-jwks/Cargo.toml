[package]
name = "veil-jwks"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["JD Williams <jd@unsung-operators.com>"]
description = "Generic JWKS-backed JWT validation for VEIL auth applications."
repository = "https://github.com/jdwil/veil"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
