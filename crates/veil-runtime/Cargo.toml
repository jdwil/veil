[package]
name = "veil-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Product host: multi-project IDE kernel + platform HTTP"

[[bin]]
name = "veil-runtime"
path = "src/main.rs"

[dependencies]
veil-server = { path = "../veil-server" }
veil-ir = { path = "../veil-ir" }
veil-parser = { path = "../veil-parser" }
storage = { path = "../storage" }
extensions = { path = "../extensions" }
change_management = { path = "../change_management" }
deploy = { path = "../deploy" }
veil_shared = { path = "../veil_shared" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5", features = ["util"] }
async-trait.workspace = true
futures = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
aws-sdk-s3.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-lambda.workspace = true
aws-sdk-sqs.workspace = true
aws-sdk-sns.workspace = true
aws-sdk-apigatewayv2.workspace = true
aws-config.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
axum = { workspace = true }
tower = { version = "0.5", features = ["util"] }
hyper = "1"
http-body-util = "0.1"

[features]
default = ["local"]
local = []
