# Example deploy environments for ProductHost.
# Copy to ~/.veil/deploy.toml (or set VEIL_DEPLOY_CONFIG) and fill in your account.
#
# Cross-account: set assume_role_arn so provision runs as that role in the target account.
# Gateway logical names (from project veil.toml) map to fuzzy patterns for *existing* APIs.

default = "dev"

[env.dev]
region = "us-west-2"
# account_id = "123456789012"
# assume_role_arn = "arn:aws:iam::123456789012:role/veil-provision"
# lambda_execution_role_arn = "arn:aws:iam::123456789012:role/veil-lambda-dev"

[env.dev.gateways]
# Logical name from [[deploy.units.api_gateway]] gateway = "http-api"
http-api = ["*-http-api", "*-dev-service-api"]

[env.staging]
region = "us-west-2"
# assume_role_arn = "arn:aws:iam::123456789012:role/veil-provision"
# lambda_execution_role_arn = "arn:aws:iam::123456789012:role/veil-lambda-staging"

[env.staging.gateways]
http-api = ["*-staging-service-api"]

[env.prod]
region = "us-west-2"
# assume_role_arn = "arn:aws:iam::123456789012:role/veil-provision"
# lambda_execution_role_arn = "arn:aws:iam::123456789012:role/veil-lambda-prod"

[env.prod.gateways]
http-api = ["*-prod-service-api"]
