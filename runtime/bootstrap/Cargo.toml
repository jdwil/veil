[package]
name = "veil-runtime-bootstrap"
version = "0.1.0"
edition = "2024"
description = "Local product host: multi-project IDE kernel + Bus HTTP"

[[bin]]
name = "veil-runtime"
path = "src/main.rs"

[dependencies]
veil-server = { path = "../../crates/veil-server" }
veil-ir = { path = "../../crates/veil-ir" }
veil-parser = { path = "../../crates/veil-parser" }
# PVR-011: generated storage domain services + ports
storage = { path = "../generated/crates/storage" }
# EXT-02: generated extensions registry + ports
extensions = { path = "../generated/crates/extensions" }
# SDLC: change management domain services + DDB/S3 adapters
change_management = { path = "../generated/crates/change_management" }
# Deploy control plane
deploy = { path = "../generated/crates/deploy" }
veil_shared = { path = "../generated/crates/veil_shared" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-lambda = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-apigatewayv2 = "1"
aws-config = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = ["local"]
local = []

[workspace]
members = ["."]
