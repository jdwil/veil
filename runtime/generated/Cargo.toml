[workspace]
members = [
    "crates/veil_shared",
    "crates/veil_bin",
    "crates/storage",
    "crates/tools",
    "crates/daemon",
    "crates/exec",
    "crates/extensions",
    "crates/meta_execution",
    "crates/deploy",
    "crates/change_management",
    "crates/agent"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
serde_json = "1"
aws-config = "1.8.18"
aws-sdk-apigatewayv2 = "1"
aws-sdk-dynamodb = "1.116.0"
aws-sdk-lambda = "1.131.0"
aws-sdk-s3 = "1.137.0"
aws-sdk-sns = "1.104.0"
aws-sdk-sqs = "1.102.0"
axum = "0.8.9"
gix = { version = "0.70.0", features = ["tree-editor"] }
schemars = "1.2.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
veil-ir = { path = "../../crates/veil-ir" }
veil-parser = { path = "../../crates/veil-parser" }
veil_ext_store = { path = "../ext_store" }
veil_local_fs = { path = "../local_fs" }
zip = "2.4.2"
