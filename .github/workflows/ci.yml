# Minimal CI: unit tests + multi-package harness + complexity ladder (ACS-003/006)
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One logical queue per ref. Do NOT cancel-in-progress: hosted runners have been
# failing to acquire (15m then cancel). Cancelling peers only burns more capacity.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Pin image — ubuntu-latest has been failing with
    # "job was not acquired by Runner of type hosted even after multiple attempts"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (workspace)
        run: cargo test --workspace --no-fail-fast
      - name: multi-package fixture (ACS-003)
        run: |
          cargo build -p veil-cli
          make fixture-multi-harness VEIL_BIN=target/debug/veil
      - name: complexity ladder L0–L3 (ACS-006)
        run: make fixture-ladder VEIL_BIN=target/debug/veil
