[workspace]
members = [
    "crates/veil-parser",
    "crates/veil-ir",
    "crates/veil-codegen",
    "crates/veil-server",
    "crates/veil-cli",
    "crates/veil-local",
    "crates/veil-runtime",
    "crates/storage",
    "crates/change_management",
    "crates/deploy",
    "crates/extensions",
    "crates/veil_shared",
    "crates/veil_local_fs",
    "crates/veil_ext_store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["JD Williams"]

[workspace.dependencies]
# Parser
winnow = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# CLI
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Agentic LLM stack (AGT-*)
rig-core = "0.39"

# HTTP (RT-026 — S3, remote SourceStore)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Dev-loop orchestrator
toml = "0.8"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }

# Internal
veil-parser = { path = "crates/veil-parser" }
veil-ir = { path = "crates/veil-ir" }
veil-codegen = { path = "crates/veil-codegen" }
veil-server = { path = "crates/veil-server" }
veil_local_fs = { path = "crates/veil_local_fs" }
veil_ext_store = { path = "crates/veil_ext_store" }
veil_shared = { path = "crates/veil_shared" }

# Host / platform crates
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
gix = { version = "0.70.0", features = ["tree-editor"] }
schemars = "1.2.1"
sha2 = "0.10.9"
zip = "2.4.2"
aws-config = "1"
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-lambda = "1"
aws-sdk-sqs = "1"
aws-sdk-sns = "1"
aws-sdk-apigatewayv2 = "1"
